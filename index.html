<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Starm - Live Sports Channels</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #ef4444;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--accent-color);
            font-size: 2rem;
            margin-bottom: 5px;
        }
        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
        .search-box {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 25px auto;
            display: block;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 30px;
            border: 1px solid #334155;
            background-color: var(--card-bg);
            color: var(--text-color);
            outline: none;
        }
        .search-box:focus {
            border-color: var(--accent-color);
        }
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .match-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, border-color 0.2s;
        }
        .match-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }
        .sport-tag {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .tournament-name {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
        }
        .match-teams {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 15px;
        }
        .watch-btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #3b82f6;
            color: white;
            padding: 8px 12px;
            font-size: 0.9rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .watch-btn:hover {
            background-color: #2563eb;
        }
        .loading {
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sports Starm</h1>
        <p>বাংলাদেশ ও ইন্ডিয়ার জনপ্রিয় লাইভ স্পোর্টস চ্যানেল প্ল্যাটফর্ম</p>
    </header>

    <input type="text" id="searchBox" class="search-box" placeholder="চ্যানেল বা খেলার নাম খুঁজুন (যেমন: T Sports, GTV, Ten Sports)..." onkeyup="filterMatches()">

    <div id="loading" class="loading">চ্যানেলগুলো লোড হচ্ছে...</div>
    <div id="matchesGrid" class="matches-grid"></div>

    <script>
        // বাংলাদেশ ও ইন্ডিয়ার জনপ্রিয় স্পোর্টস চ্যানেল এবং আইপিটিভি ফিডের ডেটাবেজ
        let allMatches = [
            { sport: "ক্রিকেট / ফুটবল", tournament: "বাংলাদেশ ও এশিয়া", teams: "T Sports HD", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "ক্রিকেট / লাইভ", tournament: "বাংলাদেশ", teams: "GTV (Gazi TV)", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "ক্রিকেট / টুর্নামেন্ট", tournament: "বাংলাদেশ", teams: "T Sports", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "আন্তর্জাতিক স্পোর্টস", tournament: "দক্ষিণ এশিয়া", teams: "Ten Sports HD", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "ক্রিকেট ও স্পোর্টস", tournament: "ইন্ডিয়া / আন্তর্জাতিক", teams: "Star Sports 1 HD", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "ক্রিকেট ও স্পোর্টস", tournament: "ইন্ডিয়া / আন্তর্জাতিক", teams: "Star Sports 2 HD", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "হিন্দি স্পোর্টস ফিড", tournament: "ইন্ডিয়া", teams: "Star Sports Hindi", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "ক্রিকেট স্পেশال", tournament: "ইন্ডিয়া / গ্লোবাল", teams: "Willow TV HD", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "ক্রিকেট ও ফুটবল", tournament: "পাকিস্তান / এশিয়া", teams: "PTV Sports", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "গ্লোবাল স্পোর্টস",tournament: "আন্তর্জাতিক", teams: "Sony Sports Ten 1", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "গ্লোবাল স্পোর্টস", tournament: "আন্তর্জাতিক", teams: "Sony Sports Ten 2", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "ফুটবল ও ক্রিকেট", tournament: "আন্তর্জাতিক", teams: "Sony Sports Ten 5", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "মাল্টি-স্পোর্টস", tournament: "আন্তর্জাতিক", teams: "ESPN HD", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "মাল্টি-স্পোর্টস", tournament: "আন্তর্জাতিক", teams: "Eurosport HD", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "ফুটবল স্পেশাল", tournament: "ইউরোপ / গ্লোবাল", teams: "Sky Sports Main Event", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "ক্রিকেট স্পেশাল", tournament: "ইউরোপ / গ্লোবাল", teams: "Sky Sports Cricket", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "ফুটবল লিগ", tournament: "ইউরোপ", teams: "TNT Sports 1", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "ফুটবল লিগ", tournament: "ইউরোপ", teams: "TNT Sports 2", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "সকার ফিড", tournament: "আমেরিকা / গ্লোবাল", teams: "Fox Sports 1", url: "https://iptv-org.github.io/iptv/index.m3u" },
            { sport: "সকার ফিড", tournament: "আমেরিকা / গ্লোবাল", teams: "ESPN 2", url: "https://iptv-org.github.io/iptv/index.m3u" }
        ];

        // অটোমেটিক আইপিটিভি ওপেন সোর্স থেকে স্পোর্টস চ্যানেলগুলোর একটি বড় লিস্ট ফেচ বা মার্জ করার লজিক
        async function loadChannels() {
            try {
                let response = await fetch('https://iptv-org.github.io/api/streams.json');
                let data = await response.json();
                
                // যে চ্যানেলগুলোতে সরাসরি sport বা cricket বা tv আছে সেগুলোকে ফিল্টার করে আমাদের লিস্টে যোগ করা
                let apiSports = data
                    .filter(item => {
                        if (!item.channel || !item.title) return false;
                        let title = item.title.toLowerCase();
                        return title.includes('sport') || title.includes('cricket') || title.includes('football') || title.includes('t20') || title.includes('espn');
                    })
                    .slice(0, 100) // ঠিক ১০০টি স্পোর্টস চ্যানেল বা স্ট্রিম এখানে পিক করা হলো
                    .map(item => ({
                        sport: "লাইভ স্পোর্টস চ্যানেল",
                        tournament: item.broadcast_area ? item.broadcast_area.join(', ') : "আন্তর্জাতিক ফিড",
                        teams: item.title,
                        url: item.url || '#'
                    }));

                if(apiSports.length > 0) {
                    allMatches = [...allMatches, ...apiSports];
                }

                displayMatches(allMatches);
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                // কোনো কারণে এপিআই ফেচ ফেইল করলে আমাদের ডিফল্ট প্রিমিয়াম স্পোর্টস লিস্ট দেখাবে
                displayMatches(allMatches);
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayMatches(matches) {
            const grid = document.getElementById('matchesGrid');
            grid.innerHTML = '';

            if (matches.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#94a3b8;">কোনো চ্যানেল পাওয়া যায়নি।</p>';
                return;
            }

            matches.forEach(match => {
                let card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <span class="sport-tag">${match.sport}</span>
                    <div class="tournament-name">${match.tournament}</div>
                    <div class="match-teams">${match.teams}</div>
                    <a href="${match.url}" target="_blank" class="watch-btn">লাইভ দেখুন</a>
                `;
                grid.appendChild(card);
            });
        }

        function filterMatches() {
            let query = document.getElementById('searchBox').value.toLowerCase();
            let filtered = allMatches.filter(m => 
                m.teams.toLowerCase().includes(query) || 
                m.tournament.toLowerCase().includes(query) || 
                m.sport.toLowerCase().includes(query)
            );
            displayMatches(filtered);
        }

        loadChannels();
    </script>
</body>
</html>
